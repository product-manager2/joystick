app = "joystick-api"
primary_region = "sin"
# Pilot topology: exactly one API Machine and one worker Machine. Do not scale either group yet.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[processes]
  api = "node build/server/main.js"
  worker = "node build/server/worker.js"

[deploy]
  strategy = "immediate"
  release_command = "node build/db/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  HTTP_PROXY_MODE = "vercel"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["api", "worker"]

[[restart]]
  policy = "always"
  processes = ["api", "worker"]
