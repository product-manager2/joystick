<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Joystick Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Lexend:wght@400;500;600;700;800&family=Homemade+Apple&display=swap">
<style>
/* Layout: one phone screen in Joystick's cartoon style — sky-blue ground, white cards, heavy ink outlines, hard shadows, sunburst title cards.
   HUD (the duo) on top, scrolling stage in the middle, four-tab nav at the bottom. Single committed look, not theme-switched. */
:root {
  color-scheme: light;
  --paper: #DCEAFC;     /* Joystick sky, deep enough that white cards pop */
  --paper-2: #B7CBE8;
  --card: #FFFFFF;
  --cream: #FFF4D4;
  --mint: #E8F6DE;
  --ink: #1D1611;
  --ink-2: #26324A;
  --navy: #0E2A57;
  --red: #E5484D;
  --blue: #1B66D6;
  --gold: #FFC933;
  --green: #4A9F24;
  --green-d: #2E7A12;
  --pink: #F48FB1;
  --line: 3px solid var(--ink);
  --pop: 4px 4px 0 var(--ink);
  --wob: 16px 12px 18px 11px;  /* hand-inked corners */
  --display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
  --body: "Lexend", system-ui, -apple-system, sans-serif;
  --type: "Lexend", system-ui, sans-serif;
  --sign: "Homemade Apple", "Brush Script MT", cursive;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink); font-family: var(--body); font-size: 15px;
  display: flex; justify-content: center;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }

.app { position: relative; width: 100%; height: 100%; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }

/* Type */
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
p { margin: 0; line-height: 1.45; }
.display { font-family: var(--display); line-height: 1.05; letter-spacing: .02em; color: var(--navy); }
.cup { font-family: var(--display); color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); letter-spacing: .02em; line-height: .98; }
.eyebrow { font-family: var(--type); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.typed { font-family: var(--type); font-weight: 600; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

/* HUD */
.hud { display: flex; align-items: center; gap: 10px; background: var(--card); border-bottom: var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.duo-mini { position: relative; width: 56px; height: 42px; flex: none; }
.duo-mini .av { position: absolute; width: 38px; height: 38px; }
.duo-mini .av:first-child { left: 0; top: 2px; }
.duo-mini .av:last-child { left: 20px; top: 2px; }
.hud .who { flex: 1; min-width: 0; }
.hud .name { font-family: var(--display); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 11px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.meter i { display: block; height: 100%; transition: width .6s cubic-bezier(.3,1.5,.5,1); }
.hud .meter { margin-top: 3px; }
.hud .meter i { background: var(--blue); }
.hud .sub { font-family: var(--type); font-size: 11px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; }
.coins { display: flex; align-items: center; gap: 5px; font-family: var(--display); font-size: 14px; border: 2.5px solid var(--ink); border-radius: 99px; padding: 4px 9px 4px 4px; background: var(--card); box-shadow: 2px 2px 0 var(--ink); }
.coin { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2.5px solid var(--ink); display: inline-grid; place-items: center; flex: none; box-shadow: inset -2px -2px 0 rgba(0,0,0,.18); }
.coin::after { content: "$"; font-family: var(--display); font-size: 10px; line-height: 1; color: var(--ink); }
.hud { cursor: pointer; }

main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.screen { padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* Bits */
.card { background: var(--card); border: var(--line); border-radius: var(--wob); box-shadow: var(--pop); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: var(--line); border-radius: 14px 11px 15px 10px; padding: 12px 16px; font-family: var(--display); font-size: 15px; letter-spacing: .02em; background: var(--card); box-shadow: var(--pop); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.red { background: var(--red); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.gold { background: var(--gold); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 11px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); border-width: 2.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 2px solid var(--ink); border-radius: 99px; padding: 2px 9px; font-weight: 800; font-size: 12px; background: var(--card); white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
button.chip { padding: 6px 12px; font-size: 13px; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.list { display: flex; flex-direction: column; gap: 12px; }
.back { border: var(--line); background: var(--card); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; box-shadow: 2px 2px 0 var(--ink); flex: none; }
.av { width: 32px; height: 32px; flex: none; display: inline-block; }
.av svg { width: 100%; height: 100%; display: block; }
.sec-title { font-family: var(--display); font-size: 22px; letter-spacing: .02em; color: var(--navy); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; font-size: 13px; }
input.inp, textarea.inp { font: inherit; font-weight: 700; border: var(--line); border-radius: 12px; padding: 11px 12px; background: #fff; color: var(--ink); width: 100%; }
textarea.inp { resize: vertical; min-height: 60px; }

/* Roles */
.suit { display: flex; flex-direction: column; gap: 8px; }
.suit { margin-top: 6px; }
.suit-head { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--navy); padding: 5px 12px 5px 6px; border-radius: 99px; }
.suit-head .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.role-grid.full .role[aria-pressed="false"] { opacity: .45; }
.onboard > .sticky-cta { margin-top: auto; }
.sticky-cta { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 12px 4px; background: linear-gradient(transparent, var(--paper) 30%); }
.role { text-align: left; border: 2.5px solid var(--ink); border-radius: 12px 10px 13px 9px; padding: 8px 10px; background: var(--card); display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; }
.role[aria-pressed="true"] { background: var(--navy); color: #fff; }
.role[aria-pressed="true"] .muted { color: #C9D6EA; }
.role b { font-size: 14px; display: block; }
.role .muted { font-size: 11px; line-height: 1.25; display: block; }
.mono { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 13px; color: var(--ink); }
.rtag { font-family: var(--type); font-size: 11px; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

/* Onboarding */
.onboard { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-block: 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.logo { font-family: var(--display); font-size: 44px; color: var(--red); -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); transform: rotate(-3deg); align-self: flex-start; }
.sunbox { position: relative; border: var(--line); border-radius: var(--wob); overflow: hidden; box-shadow: var(--pop); padding: 22px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sunbox::before { content: ""; position: absolute; inset: -60%; z-index: -1; background: repeating-conic-gradient(from 0deg, #FFC933 0 9deg, #FFE38A 9deg 18deg); }
@keyframes spin { to { transform: rotate(1turn); } }
.bounce { animation: bounce 1s ease-in-out infinite; }
@keyframes bounce { 50% { transform: translateY(-6px) rotate(-3deg); } }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); }
.dots i.on { background: var(--red); }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tier { border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px; background: var(--card); font-size: 12px; line-height: 1.3; }
.tier b { font-family: var(--display); font-weight: 400; font-size: 14px; display: block; margin-bottom: 2px; }
.tier.on { background: var(--gold); }

/* Lobby */
.raid { background: var(--navy); color: var(--paper); border: var(--line); border-radius: var(--wob); padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--pop); }
.raid .muted { color: #C9D6EA; font-size: 13px; }
.raid .display { color: #fff; }
.raid .clock { font-family: var(--display); color: var(--gold); font-size: 18px; }
.poster { width: 100%; text-align: left; padding: 0; overflow: hidden; display: block; }
.poster .band { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: var(--line); }
.glyph { width: 52px; height: 52px; border: var(--line); border-radius: 50%; display: grid; place-items: center; background: var(--card); flex: none; }
.glyph svg { width: 30px; height: 30px; }
.poster h3 { font-family: var(--display); font-size: 19px; line-height: 1.05; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.poster .body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.pips { display: flex; gap: 4px; flex: 1; }
.pips i { flex: 1; max-width: 34px; height: 11px; border: 2px solid var(--ink); border-radius: 3px; background: var(--card); }
.pips i.done { background: var(--green); }
.pips i.now { background: var(--gold); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { background: var(--card); } }
.bounty { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 15px; }

/* Mission */
.mhead { padding: 0; overflow: hidden; }
.mhead .band { padding: 14px; display: flex; gap: 12px; align-items: center; border-bottom: var(--line); }
.mhead h1 { font-family: var(--display); font-size: 25px; line-height: 1; color: #fff; -webkit-text-stroke: 3.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
.mhead .in { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 2.5px solid var(--ink); border-radius: 10px; padding: 7px 8px; background: var(--paper); }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 17px; }
.stat span { font-family: var(--type); font-size: 11px; color: var(--ink-2); }
.tabs { display: grid; grid-template-columns: repeat(3,1fr); border: var(--line); border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: var(--pop); }
.tabs button { border: 0; background: none; padding: 10px 4px; font-family: var(--display); font-size: 13px; }
.tabs button + button { border-left: var(--line); }
.tabs button[aria-selected="true"] { background: var(--gold); }

.map { position: relative; padding-block: 6px; }
.map svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-row { position: relative; height: 116px; }
.node { position: absolute; top: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: 150px; background: none; border: 0; padding: 0; }
.node .disc { width: 72px; height: 72px; border-radius: 50%; border: 3.5px solid var(--ink); display: grid; place-items: center; box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-size: 24px; background: var(--card); }
.node.done .disc { background: var(--green-d); color: #fff; }
.node.now .disc { background: var(--gold); animation: bob 1.4s ease-in-out infinite; }
.node.locked .disc { background: var(--paper-2); color: var(--ink-2); }
.node.boss .disc { width: 86px; height: 86px; background: var(--red); color: var(--card); }
.node.boss.locked .disc { background: #F7B6B8; color: var(--ink); }
.node .lbl { font-weight: 800; font-size: 13px; background: var(--card); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; }
.node .flag { position: absolute; top: -14px; z-index: 1; background: var(--red); color: var(--card); border: 2px solid var(--ink); border-radius: 6px; font-family: var(--type); font-size: 11px; padding: 1px 6px; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(4deg); } }

.rule { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; }
.num { width: 28px; height: 28px; border: 2.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 13px; flex: none; background: var(--gold); }
.statline { display: grid; grid-template-columns: 1fr 90px 38px; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.statline .meter i { background: var(--gold); }
.squad { padding: 12px; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; }
.squad .rank { font-family: var(--display); font-size: 22px; text-align: center; }
.squad .meter { margin-top: 6px; }
.squad.you { background: var(--cream); }
.stack { display: flex; }
.stack > * + * { margin-left: -9px; }

/* Stage + quests */
.stage-head { position: relative; overflow: hidden; border: var(--line); border-radius: var(--wob); box-shadow: var(--pop); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--ink); color: var(--paper); }
.stage-head .muted { color: #C9D6EA; }
.gate { height: 16px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.gate i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--gold) 0 9px, #F0B400 9px 18px); transition: width .6s; }
.quest { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.quest.boss { background: #FFE6E6; }
.quest.done { background: var(--mint); }
.quest h3 { font-family: var(--body); font-weight: 800; font-size: 15px; line-height: 1.25; }
.qmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.size { font-family: var(--display); font-size: 11px; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 6px; background: var(--card); }
.qbtns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.prog { height: 12px; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; background: var(--card); }
.prog i { display: block; height: 100%; width: 0; background: var(--blue); }
.log { font-family: var(--type); font-size: 12px; color: var(--ink-2); }
.call { border: 2.5px dashed var(--ink); border-radius: 12px; padding: 10px; background: var(--cream); display: flex; flex-direction: column; gap: 8px; }
.call .who { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
.call .opts { display: flex; flex-direction: column; gap: 6px; }
.call .opts button { text-align: left; border: 2.5px solid var(--ink); border-radius: 10px; padding: 8px 10px; background: var(--card); font-weight: 700; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
.call .opts button:active { transform: translate(2px,2px); box-shadow: none; }

/* Quest board rows */
.qrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; width: 100%; }
.qrow b { font-weight: 800; font-size: 14px; line-height: 1.25; display: block; }

/* Comms */
.thread-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; width: 100%; }
.thread-row .last { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-row .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread { min-width: 22px; height: 22px; border-radius: 99px; background: var(--red); color: #fff; border: 2px solid var(--ink); font-family: var(--display); font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; gap: 10px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: var(--line); background: var(--card); }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.bubble { background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: 8px 11px; box-shadow: 2px 2px 0 var(--ink); line-height: 1.4; min-width: 0; }
.msg.me .bubble { background: var(--gold); border-radius: 16px 16px 4px 16px; }
.msg .from { font-family: var(--type); font-size: 11px; color: var(--ink-2); margin-bottom: 2px; }
.msg.wide { max-width: 100%; width: 100%; }
.msg.wide .bubble { flex: 1; }
.composer { display: flex; gap: 8px; align-items: center; border-top: var(--line); background: var(--card); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.composer input { flex: 1; min-width: 0; font: inherit; font-weight: 700; border: var(--line); border-radius: 99px; padding: 10px 14px; background: #fff; color: var(--ink); }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 0; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.form-card { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.form-card .ed { display: flex; gap: 6px; align-items: center; }
.form-card .ed input { flex: 1; min-width: 0; font: inherit; font-weight: 700; border: 2px solid var(--ink); border-radius: 9px; padding: 7px 9px; background: #fff; color: var(--ink); }
.form-card .x { border: 2px solid var(--ink); border-radius: 8px; background: var(--card); width: 30px; height: 30px; flex: none; }
.amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.amounts button { border: 2px solid var(--ink); border-radius: 9px; padding: 8px 2px; background: var(--card); font-family: var(--display); font-size: 12px; }
.amounts button[aria-pressed="true"] { background: var(--gold); }
.mini-roles { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-roles button { border: 2px solid var(--ink); border-radius: 99px; padding: 4px 10px; background: var(--card); font-weight: 800; font-size: 12px; }
.mini-roles button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.typing i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin-right: 3px; animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4; } }

/* Duo */
.duo-card { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.duo-pair { display: flex; justify-content: center; align-items: flex-end; gap: 0; }
.duo-pair .av { width: 92px; height: 92px; }
.duo-pair .av + .av { margin-left: -14px; }
.learned { display: flex; flex-direction: column; gap: 6px; }
.learned li { list-style: none; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.learned li::before { content: "✎"; font-family: var(--display); }
.stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stamp { aspect-ratio: 1; max-width: 100%; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 12px; line-height: 1; transform: rotate(-8deg); padding: 6px; }

.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Nav */
.nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: var(--line); padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--display); font-size: 12px; padding: 6px 2px; color: var(--ink-2); }
.nav svg { width: 28px; height: 28px; }
.nav button[aria-current="true"] { color: var(--ink); }
.nav button[aria-current="true"] .fill { fill: var(--gold); }
.nav .badge { position: absolute; top: 2px; left: calc(50% + 6px); }

/* Overlays */
.scrim { position: absolute; inset: 0; background: rgba(30,22,17,.6); z-index: 20; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 90%; overflow-y: auto; background: var(--paper); border-top: var(--line); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 14px; padding-block: 12px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: up .25s cubic-bezier(.2,1.2,.4,1); }
@keyframes up { from { transform: translateY(100%); } }
.contract { background: var(--cream); border: var(--line); border-radius: 6px; padding: 16px; box-shadow: var(--pop); display: flex; flex-direction: column; gap: 10px; outline: 2px solid var(--ink); outline-offset: -9px; }
.contract .clause { font-size: 14px; line-height: 1.5; }
.sigline { border-bottom: 2.5px solid var(--ink); height: 44px; display: flex; align-items: flex-end; justify-content: center; font-family: var(--sign); font-size: 22px; color: var(--blue); overflow: hidden; }
.sigline span { animation: write .8s steps(14) both; white-space: nowrap; overflow: hidden; display: inline-block; }
@keyframes write { from { width: 0; } }
.toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); border: 2.5px solid var(--paper); border-radius: 12px; padding: 9px 14px; font-weight: 800; box-shadow: var(--pop); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
.toast b { color: var(--gold); font-family: var(--display); font-weight: 400; }
@keyframes pop { from { transform: translateX(-50%) scale(.5); opacity: 0; } }
.titlecard { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; overflow: hidden; background: var(--blue); color: #fff; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); animation: iris .45s ease-out; }
.titlecard::before { content: ""; position: absolute; inset: -70%; z-index: -1; background: repeating-conic-gradient(from 0deg, #2C77E4 0 8deg, #1B66D6 8deg 16deg); }
.titlecard .big { font-size: clamp(44px, 15vw, 66px); animation: slam .5s cubic-bezier(.2,1.7,.4,1) both; }
.titlecard .sub { font-family: var(--display); font-size: 18px; color: var(--navy); background: var(--card); border: var(--line); border-radius: 10px; padding: 4px 12px; box-shadow: var(--pop); }
.titlecard .top { font-family: var(--type); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
@keyframes iris { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(80% at 50% 50%); } }
@keyframes slam { from { transform: scale(2.4) rotate(-10deg); opacity: 0; } }
.confetti { position: absolute; top: -20px; width: 10px; height: 14px; border: 2px solid var(--ink); animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* Title screen */
.title-screen { min-height: 100%; display: flex; flex-direction: column; }
.hero { flex: 1; justify-content: center; position: relative; overflow: hidden; isolation: isolate; background: var(--blue); color: #fff; border-bottom: var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding-block: 18px 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(255,255,255,.18) 1.5px, transparent 1.6px); background-size: 18px 18px; }
.live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; background: var(--navy); border: 2px solid #fff; border-radius: 99px; padding: 3px 10px; }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: #5BE36A; animation: blink 1.2s steps(2) infinite; }
.logo-big { font-family: var(--display); font-size: clamp(52px, 17vw, 72px); line-height: 1; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink); transform: rotate(-4deg); margin-top: 6px; }
.hero-tag { font-family: var(--display); font-size: 24px; line-height: 1.05; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); letter-spacing: .02em; }
.howto-wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.howto { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 6px; }
.howto::-webkit-scrollbar { display: none; }

.panel-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; height: 100%; }

.mini-chat { display: flex; flex-direction: column; gap: 8px; }

.mini-opts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

.ticker { background: var(--navy); color: #fff; border-block: var(--line); overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; padding-block: 7px; }

@keyframes marquee { to { transform: translateX(-50%); } }
.start { display: flex; flex-direction: column; gap: 12px; padding-block: 16px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Mission picks, my missions, badges */
.pickm { display: block; width: 100%; padding: 0; overflow: hidden; text-align: left; }
.pickm .band { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: var(--line); }
.pickm .band .glyph { width: 40px; height: 40px; }
.pickm .band .glyph svg { width: 22px; height: 22px; }
.pickm .band b { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.05; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.pick-body { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; }
.fit { grid-column: 1; font-size: 12px; font-weight: 700; color: var(--green-d); }
.pick-tick { grid-column: 2; grid-row: 1 / span 2; font-family: var(--display); font-size: 14px; border: 2.5px solid var(--ink); border-radius: 10px; padding: 6px 10px; background: var(--card); }
.pickm[aria-pressed="true"] { box-shadow: 4px 4px 0 var(--blue); }
.pickm[aria-pressed="true"] .pick-tick { background: var(--green-d); color: #fff; }
.mine { padding: 0; overflow: hidden; }
.mine .band { width: 100%; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: var(--line); text-align: left; }
.mine .band h3 { flex: 1; font-family: var(--display); font-size: 19px; line-height: 1.05; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.mine .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.news { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.news li { font-size: 13px; padding-left: 14px; position: relative; color: var(--ink-2); }
.news li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.news li.hotline { color: var(--red); font-weight: 700; }
.news li.hotline::before { background: var(--red); }
.explore-nudge { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 14px; text-align: left; width: 100%; background: var(--cream); border-style: dashed; }

.linkbtn { background: none; border: 0; font-size: 14px; color: var(--ink-2); padding: 4px; }
.linkbtn b { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.medals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }

.medal span { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.medal.off b, .medal.off span { color: #7A8AA8; }
.medal-pop { animation: slam .5s cubic-bezier(.2,1.7,.4,1) both; filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25)); }

/* Title hero */
.hero-stage { position: relative; width: min(100%, 360px); height: 168px; display: grid; place-items: end center; }

.podium { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 230px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); z-index: 1; }
.hero-bubble { position: absolute; z-index: 3; top: 4px; right: max(0px, calc(50% - 150px)); font-weight: 800; font-size: 14px; color: var(--ink); padding: 6px 10px; border-radius: 14px 14px 14px 4px; }
.sticker { position: absolute; z-index: 3; display: inline-flex; align-items: center; gap: 5px; font-family: var(--display); font-size: 13px; letter-spacing: .02em; color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 9px; box-shadow: 3px 3px 0 var(--ink); animation: float 3s ease-in-out infinite; }
.sticker .coin { width: 16px; height: 16px; }
.sticker.s1 { top: 22px; left: 0; transform: rotate(-8deg); }
.sticker.s2 { bottom: 0; left: 0; background: var(--mint); color: var(--green-d); transform: rotate(5deg); animation-delay: .6s; }
.sticker.s3 { bottom: 2px; right: 0; background: var(--red); color: #fff; transform: rotate(-6deg); animation-delay: 1.1s; }
.sticker.medal-st { top: 34px; right: 6px; background: none; border: 0; box-shadow: none; padding: 0; transform: rotate(10deg); animation-delay: .3s; }
@keyframes float { 50% { translate: 0 -5px; } }
.ribbon { position: relative; margin-inline: 22px; }
.ribbon span { position: relative; z-index: 1; display: block; font-family: var(--display); font-size: clamp(14px, 4.3vw, 22px); white-space: nowrap; letter-spacing: .03em; color: var(--navy); background: var(--gold); border: 3px solid var(--ink); padding: 6px 16px; box-shadow: 0 4px 0 var(--ink); }
.ribbon::before, .ribbon::after { content: ""; position: absolute; top: 10px; width: 30px; height: 100%; background: #E0A800; border: 3px solid var(--ink); z-index: 0; }
.ribbon::before { left: -22px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%); }
.ribbon::after { right: -22px; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%); }
.hero-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 4px; }
.hero-stats span { font-size: 12px; font-weight: 600; background: var(--navy); border: 2px solid #fff; border-radius: 99px; padding: 3px 10px; }
.hero-stats b { color: var(--gold); font-weight: 800; }

.hero-start { width: min(100%, 420px); padding: 6px 0 0; text-align: left; }
.hero-start label { color: #fff; }
.hero-start .linkbtn { color: #fff; }
.hero-start .linkbtn b { color: var(--gold); }
.howto-link { color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; opacity: .9; }

/* Home takes */
.home-switch { position: absolute; top: 8px; right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; display: flex; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; box-shadow: 2px 2px 0 var(--ink); }
.home-switch button { border: 0; background: none; padding: 3px 9px; font-size: 11px; font-weight: 800; color: var(--ink); }
.home-switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.title-screen { position: relative; }
.deck-home, .map-home { background: var(--blue); background-image: radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px); background-size: 18px 18px; color: #fff; }
.deck-top, .map-top { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-block: 40px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo-mid { font-family: var(--display); font-size: clamp(40px, 13vw, 58px); line-height: 1; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); transform: rotate(-3deg); }
.deck-tag { font-family: var(--display); font-size: clamp(18px, 5.4vw, 24px); line-height: 1.1; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; letter-spacing: .02em; }
.deck-tag span { color: var(--gold); display: block; }
.deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scroll-padding-inline: 16px; }
.deck::-webkit-scrollbar { display: none; }
.deckcard { flex: 0 0 min(86%, 380px); scroll-snap-align: start; padding: 0; overflow: hidden; color: var(--ink); }
.deckcard .band { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: var(--line); }
.deckcard .band .glyph { width: 42px; height: 42px; }
.deckcard .band .glyph svg { width: 24px; height: 24px; }
.deckcard h3 { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.05; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.dbody { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.dwhy { font-size: 14px; font-weight: 600; }
.early { white-space: nowrap; font-family: var(--display); font-size: 13px; background: var(--navy); color: var(--gold); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; }
#deckdots i { border-color: #fff; }
#deckdots i.on { background: var(--gold); }
.overworld { padding-inline: max(8px, env(safe-area-inset-left, 0px)); }
.overworld svg { width: 100%; max-width: 520px; display: block; margin: 0 auto; }
.isle { cursor: pointer; }
.isle.on > path:first-of-type { stroke-width: 4; }
.isle-label { font-family: var(--display); font-size: 13px; fill: #fff; stroke: #1D1611; stroke-width: 4px; paint-order: stroke fill; letter-spacing: .02em; }
.isle-card { margin-inline: max(16px, env(safe-area-inset-left, 0px)); padding: 12px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.deck-home .start, .map-home .start { width: auto; padding-block: 12px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.deck-home, .map-home { justify-content: space-between; padding-block: 0 8px; }
.deck-home .deck-top, .map-home .map-top { padding-top: 52px; gap: 10px; }
.deck-mid { display: flex; flex-direction: column; gap: 6px; }
.deck-home .deck { padding-block: 14px 8px; }
.deck-home .punch { font-size: 25px; }
.deck-home .dbody { padding: 16px 14px; gap: 12px; }
.deck-home .start { padding-bottom: 28px; }
.hero-sub { font-size: 16px; font-weight: 600; color: #fff; max-width: 32ch; }
.punch { font-family: var(--display); font-size: 22px; line-height: 1.08; letter-spacing: .02em; color: var(--navy); }
.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 2px dashed var(--paper-2); padding-top: 10px; }
.bignums div { display: flex; flex-direction: column; align-items: center; }
.bignums b { font-family: var(--display); font-size: 22px; font-weight: 400; color: var(--ink); letter-spacing: .02em; }
.bignums span { font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.hero-start .linkbtn { text-decoration: underline; text-underline-offset: 3px; }

/* Play hub */
.raid-pips { display: flex; gap: 6px; margin-top: 8px; }
.raid-pips i { width: 28px; height: 10px; border-radius: 99px; border: 2px solid #fff; }
.raid-pips i.on { background: var(--gold); }
.qplay { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; }
.qplay .qbody { text-align: left; background: none; border: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.qplay .qbody b { font-weight: 700; font-size: 14px; line-height: 1.25; }
.chanrow, .callrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; text-align: left; width: 100%; }
.callrow { grid-template-columns: 32px 1fr auto; background: var(--cream); }
.callrow b { display: block; font-size: 14px; line-height: 1.25; }
.firstrun { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--cream); }
.av.big { width: 56px; height: 56px; }
.swatches { display: flex; gap: 10px; }
.swatch { width: 38px; height: 38px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }

.crate { cursor: pointer; background: var(--card); color: var(--ink); }

/* Stage list + quest rooms */
.stage-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage-list .list { gap: 10px; }

.qstat { font-size: 11px; font-weight: 800; border: 2px solid var(--ink); border-radius: 99px; padding: 2px 8px; white-space: nowrap; background: var(--card); }
.qstat.done { background: var(--green-d); color: #fff; border-color: var(--green-d); }
.qstat.live { background: var(--blue); color: #fff; }

.room-title { font-weight: 800; font-size: 15px; line-height: 1.2; color: var(--navy); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.room-bar { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; border-top: var(--line); background: var(--card); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

// ===================== Content =====================
const SUITS = {

  patron:       { suit: "givers",     name: "Patron",       mono: "Pa", does: "Backs it with money" },
};
const roleColor = k => SUITS[ROLES[k].suit].color;
const TIERS = [
  { name: "Sidekick", min: 0,  does: "Solo: S quests" },
  { name: "Partner",  min: 35, does: "Solo: S + M quests", unlock: "Now runs M quests solo" },

function ensureStrategies(m) {

  const cfg = STRATS[m.id];
  if (!cfg) {
    m.target = Math.max(3, m.quests.length); m.unit = "results";
    m.strategies = [{ id: m.id + "-s1", name: "Founding plan", squad: "Founders", lead: m.creator, color: "#FF9F5A", score: 0, backers: 1, bet: "The creator's first plan. Propose a better one!" }];
    m.quests.forEach(q => { q.strat = m.strategies[0].id; if (q.gain == null) q.gain = 1; });
    return m.strategies;
  }
  m.stages[m.current].goal = cfg.goal;
  m.target = cfg.target; m.unit = cfg.unit;
  m.quests.push(...cfg.extra);
  m.strategies = cfg.strategies.map(({ quests, ...s }) => s);
  cfg.strategies.forEach(s => s.quests.forEach(id => { m.quests.find(q => q.id === id).strat = s.id; }));
  m.quests.forEach(q => {
    if (q.parent) { const p = m.quests.find(x => x.id === q.parent); q.strat = p.strat; (p.parts = p.parts || []).push(q.id); }
    const [gain, out] = cfg.q[q.id] || [0, ""];
    q.gain = q.gain ?? gain; q.out = q.out || out;
  });
  return m.strategies;
}

const FULL = ["stage", "strategy", "quest", "session", "thread", "forge", "gate"];

      const i = (Math.round(c.scrollLeft / c.clientWidth) + 1) % 3;
      c.scrollTo({ left: i * c.clientWidth, behavior: "smooth" });

    toast(`${FUELS[k].name} added · <b>+${fmt(sh)} ${tok(m)}</b>`);
  });
  $("#app").appendChild(scrim);
}

// ===================== Contract (joining) =====================
function contractSheet(mid) {
  const m = mission(mid);
  let picks = [...S.roles];
  let signed = false;
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  let allRoles = false, terms = false;
  const draw = () => {
    const shown = allRoles ? Object.keys(ROLES) : [...new Set([...S.roles, ...picks])];
    const est = tokFor(m, { money: S.pledge.money, compute: S.pledge.compute });
    scrim.innerHTML = `<div class="sheet contract-sheet" role="dialog" aria-label="Mission contract">
      <div class="row"><span class="spacer"></span><button class="sheet-x" data-c="close" aria-label="Close">✕</button></div>
      <div class="contract">
        <div class="cup" style="font-size:26px;text-align:center;color:var(--red)">Contract</div>
        <p class="clause"><b>${esc(duoName())}</b> join <b>${esc(m.title)}</b> as:</p>
        <div class="mini-roles">${shown.map(k => `<button data-c="role" data-x="${k}" aria-pressed="${picks.includes(k)}">${ROLES[k].name}</button>`).join("")}${allRoles ? "" : `<button data-c="more" class="more-roles">+ More</button>`}</div>
        <p class="clause">We win when:</p>
        <ol class="wins">${m.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
        <p class="clause">We bring <span class="small muted">(charged to your card, not your earnings)</span>:</p>
        ${[["time", "Time / wk", [2, 5, 10], v => v + "h"], ["money", "Money", [0, 25, 100], v => "$" + v], ["compute", "GPU-h", [0, 20, 100], v => v ? v : "None"]].map(([k, l, opts, f]) => `
          <div class="pledge"><span class="small"><b>${l}</b></span><span class="mini-roles">${opts.map(v => `<button data-c="pledge" data-k="${k}" data-x="${v}" aria-pressed="${S.pledge[k] === v}">${f(v)}</button>`).join("")}</span></div>`).join("")}
        <button class="linkbtn" data-c="terms" style="align-self:flex-start;padding:0"><b>Fine print ${terms ? "▴" : "▾"}</b></button>
        ${terms ? `<ul class="news"><li>Licence: ${LICENSE[m.id] || "MIT"} on everything you ship</li><li>Claim a quest, then finish in 3 days or it reopens</li><li>Leave any time. Approved work stays paid</li><li>You're credited on what the mission ships</li><li>Disputes go to Referees. Their call is final</li></ul>` : ""}
        <div class="sigline">${signed ? `<span>${esc(S.name || "player")} & ${esc(S.agentName)}</span>` : ""}</div>
        <div class="typed small muted" style="text-align:center">signature</div>
      </div>
      <div class="sign-bar"><span class="small"><b class="display" style="font-size:18px;color:var(--navy)">+${fmt(est)} ${tok(m)}</b><span class="muted" style="display:block">now · more as you play</span></span><button class="btn red" data-c="sign" ${picks.length ? "" : "disabled"}>${signed ? "Signed!" : "Sign"}</button></div>
    </div>`;
  };
  draw();
  scrim.addEventListener("click", e => {
    if (e.target === scrim) { S.pendingQuest = null; return scrim.remove(); }
    const b = e.target.closest("[data-c]");
    if (!b || signed) return;
    if (b.dataset.c === "close") { S.pendingQuest = null; return scrim.remove(); }
    if (b.dataset.c === "more") { allRoles = true; return draw(); }
    if (b.dataset.c === "terms") { terms = !terms; return draw(); }
    if (b.dataset.c === "pledge") { S.pledge[b.dataset.k] = +b.dataset.x; return draw(); }
    if (b.dataset.c === "role") { const k = b.dataset.x; picks = picks.includes(k) ? picks.filter(x => x !== k) : [...picks, k]; return draw(); }
    if (b.dataset.c === "sign") {
      signed = true; draw();
      S.joined[m.id] = picks; m.players++;
      const sh = contribute(m, { money: S.pledge.money, compute: S.pledge.compute });
      setTimeout(() => toast(`Pledged · <b>+${fmt(sh)} ${tok(m)}</b> at ×${mult(m)}`), 1800);
      award("squad");
      threads.splice(1, 0, { id: "sq-" + m.id, kind: "squad", mission: m.id, title: `Your squad · ${m.title}`, unread: 1, msgs: [
        { who: "Rosa", color: "#F48FB1", text: `Hey! Critic here. Take ${m.stages[m.current].name} together?` }] });
      setTimeout(() => {
        scrim.remove();
        gain(50, 0, 2);
        titleCard(esc(m.title), "SIGNED!", "Ready? Go!", () => {
          const pq = S.pendingQuest; S.pendingQuest = null;
          go("stage", { missionId: m.id });
          if (pq) setTimeout(() => playQuest(pq.id, pq.mode), 100);
        }, 1300);
      }, 900);
    }
  });
  $("#app").appendChild(scrim);
}

function sendInThread(text) {
  const t = thread(S.thread);

    t.msgs = t.msgs.filter(x => !x.typing);

    else { const [n, c] = TEAMMATES[Math.floor(Math.random() * TEAMMATES.length)]; t.msgs.push({ who: n, color: c, text: ["Nice. Checking it now.", "Copy. Ping me at the final vote.", "Our agents can split the rest."][t.msgs.length % 3] }); }

function agentReply(text) {
  const low = text.toLowerCase();
  if (low.includes("next")) {
    const q = missions.flatMap(m => m.quests.filter(x => playable(x) && S.roles.includes(x.role)))[0] || missions[0].quests.find(playable);
    return { agent: true, text: "This one. Squad needs it.", quest: q && q.id };
  }
  if (low.includes("learn")) {
    return { agent: true, html: true, text: S.learned.length ? "So far:<br>" + S.learned.slice(0, 4).map(l => "• " + esc(l)).join("<br>") : "Not much yet. Play a quest with me." };
  }
  learn(`You said: “${text}”`);
  gain(0, 0, 1);
  return { agent: true, text: `Got it. I'll do it your way.` };
}

let reopen = null;
function drill(title, body, sub = "", again = null) {
  reopen = again;

  const old = $(".dd");

  const s = document.createElement("div");
  s.className = "scrim dd";
  s.innerHTML = `<div class="sheet" role="dialog" aria-label="${title}">${inner}</div>`;
  s.addEventListener("click", e => { if (e.target === s) s.remove(); });
  $("#app").appendChild(s);
}

function proofSheet(q) {
  q.proof = q.proof || [];
  const ready = q.evidence.every((_, i) => q.proof[i]);
  drill("Add proof", `<div class="small muted">A Critic checks these before it counts.</div>
    <div class="dgroup">${q.evidence.map((e, i) => drow(tick(q.proof[i], "✓", "○"), esc(e), q.proof[i] ? esc(q.proof[i]) : "Photo, PDF or link", q.proof[i] ? "" : `<button class="btn sm" data-a="attach" data-x="${i}" data-q="${q.id}" data-keep="1">Attach</button>`)).join("")}</div>
    <button class="btn red block" data-a="submitproof" data-x="${q.id}" ${ready ? "" : "disabled"}>Submit for review</button>`, esc(short(q.title)), () => proofSheet(q));
}
function disputeSheet(q) {
  drill("Dispute the review", `<p class="small">3 Referees from squads not racing this milestone re-run the work. They decide within 24h.</p>
    <div class="dgroup">${drow(tick(1), "If they side with you", "It's approved. The reviewer's score drops.")}${drow(tick(0), "If they don't", "You fix it and lose 5 rep. This stops spam disputes.")}</div>
    <div class="qbtns"><button class="btn red" data-a="filedispute" data-x="${q.id}">File dispute</button><button class="btn" data-a="fixq" data-x="${q.id}">Fix it instead</button></div>`, esc(short(q.title)));
}
function reviewInfo() {
  drill("How review works", `<div class="dgroup">
    ${drow("1", "2 Critics from other squads", "Nobody reviews their own squad's work")}
    ${drow("2", "They re-run it", "Checked against the brief's “Done when” list")}
    ${drow("3", "Both approve, it counts", "Pay is held until the milestone is cleared")}
    ${drow("$", "Critics get paid too", "$8 per review. Overruled reviews cost them score")}
    ${drow("⚑", "Spam guard", "3 rejected submissions in a day pauses your agent")}
  </div>`);
}
function guardSheet() {
  drill("Who are the referees?", `<p class="small">9 players with high review scores, picked at random from squads that aren't racing this milestone. They check the evidence and vote on whether the milestone is really done.</p>
    <div class="dgroup">${drow("✓", "Paid per milestone", "From the 15% referee share of the bounty")}${drow("24h", "Challenge window", "Any token holder can flag evidence before payouts")}${drow("⚖", "Disputes", "Referees also settle review disputes")}</div>`);
}
function challengeSheet(m) {
  drill("Challenge the result", `<div class="small muted">Flag evidence you think is wrong. Referees re-check it before payouts.</div>
    <div class="dgroup">${strats(m).filter(s => s.score).map(s => drow(stratBadge(s, 28), esc(s.name), `+${s.score} ${m.unit}`, `<button class="btn sm" data-a="flag">Flag</button>`)).join("")}</div>`, esc(m.title));
}
function skillsSheet() {
  const more = ["Python", "Docking (Vina)", "Pharmacology", "ML", "Med chem", "C++", "Writing"].filter(k => !hasSkill(k)).slice(0, 4);
  drill("Skills", `<div class="small muted">Verified skills unlock harder quests and squad slots. Self-reported ones still help matching.</div>
    ${S.skills.length ? `<div class="dgroup">${S.skills.map(([k, h]) => drow(tick(/verified/.test(h), "✓", "~"), esc(k), esc(h), /verified/.test(h) ? "" : `<button class="btn sm" data-a="verify" data-x="${esc(k)}">Verify</button>`)).join("")}</div>` : `<p class="small muted">None yet.</p>`}
    <div class="eyebrow">Add a skill</div>
    <div class="dgroup">${more.map(k => drow("+", esc(k), "", `<button class="btn sm" data-a="verify" data-x="${esc(k)}">Verify</button>`)).join("")}</div>`);
}
function toolsSheet() {
  drill("Connected tools", `<div class="small muted">The real work happens in these. ${esc(S.agentName)} uses them for you, and results sync back.</div>
    <div class="dgroup">${Object.keys(TOOLS).map(t => drow(tick(S.tools[t]), esc(t), esc(TOOLS[t]), `<button class="btn sm ${S.tools[t] ? "" : "blue"}" data-a="tool" data-x="${esc(t)}" data-keep="1">${S.tools[t] ? "Disconnect" : "Connect"}</button>`)).join("")}</div>`, "", toolsSheet);
}
function spendSheet() {
  drill("Spending limit", `<p class="small">${esc(S.agentName)} asks before spending more than this from a strategy's budget. Every spend is logged in the mission's ledger.</p>
    <div class="amounts">${[0, 10, 25, 100].map(a => `<button data-a="cap" data-x="${a}" data-keep="1" aria-pressed="${S.spendCap === a}">$${a}</button>`).join("")}</div>
    <p class="small muted">${S.spendCap ? `Up to $${S.spendCap} without asking.` : "Always asks."}</p>`, "", spendSheet);
}
function creditsSheet() {
  drill("Credits", `<div class="small muted">When a mission ships a paper, dataset or release, everyone here gets named, ordered by approved work.</div>
    ${S.credits.length ? `<div class="dgroup">${S.credits.map(c => { const mm = mission(c.m); return drow(mm ? chanIcon(mm, 28) : "★", esc(c.what), esc([mm && mm.title, c.out].filter(Boolean).join(" · "))); }).join("")}</div>` : `<p class="small muted">Clear a quest to earn your first credit.</p>`}
    <div class="eyebrow">Export</div>
    <div class="row wrap" style="gap:8px">${["ORCID", "GitHub", "LinkedIn", "CV (PDF)"].map(x => `<button class="btn sm" data-a="export" data-x="${x}">${x}</button>`).join("")}</div>`);
}
function payoutSheet() {
  drill("Payouts", `<div class="dgroup">
      ${drow(`<span class="coin"></span>`, "Available", "Yours to withdraw", `<b>$${fmt(S.coins)}</b>`)}
      ${drow("⏳", "Pending", "Approved work, paid when each milestone clears", `<b>$${fmt(S.wallet.pending)}</b>`)}
      ${drow(tick(S.kyc, "✓", "!"), "Identity", S.kyc ? "Verified · tax form on file" : "Needed once before your first withdrawal")}
    </div>
    <div class="eyebrow">How you get paid</div>
    <ul class="news"><li>Quest approved by 2 Critics, then pay is pending</li><li>Milestone clears, then pending becomes available</li><li>Withdraw to bank or USDC · 1–2 days</li></ul>
    <button class="btn red block" data-a="withdraw" ${S.coins ? "" : "disabled"}>${S.kyc ? `Withdraw $${fmt(S.coins)}` : "Verify identity to withdraw"}</button>`, "", payoutSheet);
}
function kycSheet() {
  drill("Verify once", `<div class="dgroup">${drow("1", "Photo of your ID", "Passport or driving licence")}${drow("2", "Quick selfie", "Matched to the ID")}${drow("3", "Tax form", "Filled in for you from the ID")}</div>
    <p class="small muted">About 2 minutes. Handled by a licensed payments partner.</p>
    <button class="btn red block" data-a="kyc">Verify (demo)</button>`);
}

// ===================== Final check =====================
// Clearing a milestone is a vote on evidence, not an automatic count
function gateScreen() {
  const m = mission(), g = gateOf(m), v = m.gv || (m.gv = { yes: 0, no: 0, mine: null, done: false });
  const ranked = [...strats(m)].sort((a, b) => b.score - a.score), holds = S.wallet.shares[m.id] || 0;
  return `<div class="chat">
    <div class="chat-head">${chanIcon(m)}<div style="min-width:0;flex:1"><div class="display chan-name">Final check</div><div class="small muted ellip">${esc(m.title)} · milestone ${m.current + 1}</div></div></div>
    <div class="stage-list">
      <div class="card milestone"><div class="eyebrow">The goal</div><div class="mgoal">${esc(m.stages[m.current].goal)}</div>${gateBar(m)}<div class="small"><b>${g.have}/${g.need} ${g.unit}</b> submitted</div></div>
      <div class="eyebrow">Evidence</div>
      <div class="list">${ranked.map(s => `<button class="card qitem" data-a="strategy" data-x="${s.id}">${stratBadge(s, 36)}<span style="min-width:0"><b class="qt">${esc(s.name)}</b><span class="small muted" style="display:block">${esc(s.squad)} · ${m.quests.filter(q => q.strat === s.id && q.done && !q.parts).length} approved quests</span></span><span class="qstat">+${s.score}</span></button>`).join("")}</div>
      <div class="card milestone"><div class="row"><div class="eyebrow">Referees vote</div><span class="spacer"></span><button class="info small" data-a="guardinfo">Who are they?</button></div>
        <div class="guardians" id="gvs">${gvCircles(v)}</div><div class="small muted" id="gvstat">${gvStat(v)}</div></div>
      ${holds ? `<div class="card milestone"><div class="eyebrow">Your vote · ${fmt(holds)} ${tok(m)}</div>${v.mine ? `<div class="small"><b>You: ${esc(v.mine)}</b></div>` : `<div class="qbtns"><button class="btn blue sm" data-a="gvote" data-x="Yes, it's done">Yes, it's done</button><button class="btn sm" data-a="gchallenge">Challenge</button></div>`}<div class="small muted">Challenge window: 24h. Payouts wait for it.</div></div>` : ""}
    </div>
    <div class="room-bar" style="grid-template-columns:1fr"><button class="btn red" id="gopen" data-a="opengate" ${v.done ? "" : "disabled"}>${v.done ? "Clear the milestone" : "Referees voting…"}</button></div>
  </div>`;
}
const gvCircles = v => Array.from({ length: 9 }, (_, i) => `<span class="gv ${i < v.yes ? "yes" : i < v.yes + v.no ? "no" : ""}">${i < v.yes ? "✓" : i < v.yes + v.no ? "✗" : ""}</span>`).join("");
const gvStat = v => v.done ? `<b>${v.yes}–${v.no}</b>: the milestone is done` : `Re-checking the evidence · ${v.yes + v.no}/9 voted`;
function runGateVote(m) {
  const v = m.gv;
  if (!v || v.started) return;
  v.started = true;
  const seq = ["yes", "yes", "yes", "no", "yes", "yes", "yes", "yes", "yes"];
  let i = 0;
  const t = setInterval(() => {
    if (S.screen !== "gate") return;
    v[seq[i++]]++;
    if (i >= seq.length) { v.done = true; clearInterval(t); }
    const a = $("#gvs"), b = $("#gvstat"), c = $("#gopen");
    if (a) a.innerHTML = gvCircles(v);
    if (b) b.innerHTML = gvStat(v);
    if (c && v.done) { c.disabled = false; c.textContent = "Clear the milestone"; }
  }, 500);
}

// ===================== Events =====================
window.addEventListener("resize", () => { if (S.screen === "mission" && S.tab === "map") drawTrail(); });
document.addEventListener("scroll", e => {
  if (e.target.id === "deck") {
    const i = Math.round(e.target.scrollLeft / (e.target.firstElementChild?.offsetWidth + 12 || 1));
    document.querySelectorAll("#deckdots i").forEach((d, j) => d.classList.toggle("on", j === i));
    return;
  }
  if (e.target.id !== "howto") return;
  const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
  document.querySelectorAll("#howdots i").forEach((d, j) => d.classList.toggle("on", j === i));
}, true);
document.addEventListener("input", e => {
  const t = e.target, f = S.forge;
  if (t.id === "pname") S.name = t.value.trim();
  if (t.id === "aname") S.agentName = t.value.trim() || "Pip";
  if (f && t.id === "ftitle") f.title = t.value;
  if (f && t.id === "fpitch") f.pitch = t.value;
  if (f && t.dataset.fs) f.stages[+t.dataset.fs] = t.value;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "stageBar") { const v = $("#stagesay").value.trim(); if (v) startSession(v); }
  if (e.target.id === "stratBar") { const v = $("#stratsay").value.trim(); if (v) startSession(v, `${strats(mission()).find(x => x.id === S.stratId).name}: ${v.replace(/@\S+\s*/, "").slice(0, 24)}`); }
  if (e.target.id === "roomComposer") { const v = $("#roomsay").value.trim(); if (v) sendInRoom(v); }
  if (e.target.id === "composer") { const v = $("#say").value.trim(); if (v) sendInThread(v); }
  if (e.target.id === "forgeComposer") { const v = $("#fsay").value.trim(); if (v) forgeText(v); }
});
const toggle = (arr, k, max = 99) => arr.includes(k) ? arr.filter(x => x !== k) : arr.length >= max ? arr : [...arr, k];
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled || (b.closest(".scrim") && !b.closest(".dd")) || (b.closest(".titlecard") && b.dataset.a !== "onward")) return;
  const dd = b.closest(".dd");
  if (dd && !b.dataset.keep) dd.remove();
  const a = b.dataset.a, x = b.dataset.x, f = S.forge;
  switch (a) {
    case "ob-next": if (S.ob === 2 && !S.name) S.name = "nova"; S.ob++; return render();
    case "ob-role": S.roles = toggle(S.roles, x, 3); return render();
    case "ob-mission": S.picks = toggle(S.picks || [], x); return render();
    case "ob-done": {
      (S.picks || []).forEach(id => { S.joined[id] = [...S.roles]; mission(id).players++; });
      S.badges.push("squad");
      S.lobbyTab = "mine";
      return titleCard("", "READY?", `${esc(duoName())} — Go!`, () => go("play"));
    }
    case "returning": return loadReturning();
    case "ltab": S.lobbyTab = x; return render();
    case "paint": S.botColor = x; return render();
    case "back": return go(S.from || "play");
    case "style-toggle": S.styleOpen = !S.styleOpen; return render();
    case "duo-role": { const n = toggle(S.roles, x, 3); if (n.length) S.roles = n; return render(); }
    case "go": return go(x);
    case "filter": S.filter = x; return render();
    case "ob-topic": S.obTopic = x; return render();
    case "mission": return go("mission", { missionId: x, tab: "map" });
    case "tab": S.tab = x; return render();
    case "contract": return contractSheet(x);
    case "stage": {
      const m = mission(), i = +x;
      if (i === m.current) return titleCard(`Milestone ${i + 1}`, esc(m.stages[i].name), "Ready? Go!", () => go("stage"), 1200);
      return toast(i < m.current ? `${esc(m.stages[i].name)} · cleared` : `Clear ${esc(m.stages[m.current].name)} first`);
    }
    case "openq": S.roomTab = "chat"; return go("quest", { missionId: x, questId: b.dataset.q, stratId: findQuest(b.dataset.q)[0].strat });
    case "quest": { const [q, mm] = findQuest(x); q.unread = 0; S.roomTab = q.visited ? "chat" : "brief"; q.visited = true; return go("quest", { missionId: mm.id, questId: x, stratId: q.strat }); }
    case "rtab": { const [q] = findQuest(S.questId); S.roomTab = x; if (x === "chat") q.unreadChat = 0; return render(); }
    case "strategy": return go("strategy", { stratId: x });
    case "strategy-from-map": return go("strategy", { stratId: x });
    case "backit": {
      const m = mission(), s = strats(m).find(y => y.id === x);
      S.backed = { ...(S.backed || {}), [m.id]: S.backed?.[m.id] === x ? null : x };
      if (S.backed[m.id] && s.status === "proposed") { s.backers++; if (s.backers >= s.need) { s.status = null; titleCard("Your backing tipped it", "LAUNCHED!", esc(s.name), null, 1300); } }
      else if (S.backed[m.id]) toast("Backed. <b>+$100</b> if it’s leading when the milestone clears");
      return render();
    }
    case "propose": return proposeStrategy();
    case "showall": S.showAll[x] = !S.showAll[x]; return render();
    case "vote": { const m = mission(), v = myVotes(m); v[x] = Math.max(0, (v[x] || 0) + +b.dataset.d); return render(); }
    case "lockvotes": { const m = mission(); S.locked[m.id] = true; const top = [...strats(m)].sort((a, b) => fundPct(m, b) - fundPct(m, a))[0]; toast(`Votes locked · <b>${esc(top.name)}</b> gets ${fundPct(m, top)}%`); return render(); }
    case "fuelit": return fuelSheet(x);
    case "home": S.home = x; return render();
    case "mapisle": S.mapPick = x; return render();
    case "newstrat": { const c = mission().sessions.find(c => c.id === S.sessionId); if (c) c.proposing = false; return launchStrategy(x); }
    case "split": return splitQuest(x);
    case "dosplit": return doSplit(x);
    case "session": return go("session", { sessionId: x });
    case "roomquick": return sendInRoom(x);
    case "mission-ch": return go("stage", { missionId: x });
    case "play": return playQuest(x, b.dataset.mode);
    case "pick": return pickCall(x, +b.dataset.i);
    case "thread": return go("thread", { thread: x });
    case "quick": return sendInThread(x);
    case "forge": return forgeStart();
    case "f-kind": return forgeKind(x);
    case "f-next": return forgeNext();
    case "f-addstage": f.stages.splice(f.stages.length - 1, 0, "New milestone"); return render();
    case "f-delstage": f.stages.splice(+x, 1); return render();
    case "f-rule": { const r = f.ruleOpts[+x]; f.rules = toggle(f.rules, r); return render(); }
    case "f-role": f.roles = toggle(f.roles, x); return render();
    case "f-amt": f.bounty = +x; return render();
    case "f-launch": return forgeLaunch();
    case "f-fund": f.funded = true; toast(`$${fmt(f.bounty)} locked in escrow`); return render();
    case "dclose": return;
    case "notifs": return notifSheet();
    case "trust": return trustSheet(mission(x));
    case "ledger": return ledgerSheet(mission());
    case "flagspend": return toast("Flagged. Referees will ask for the receipt");
    case "manage": return manageSheet(mission());
    case "approvestrat": strats(mission()).forEach(s => { if (s.status === "review") s.status = null; }); toast("Approved. It's live"); return render();
    case "topup": return fuelSheet(S.missionId);
    case "person": return personSheet(x);
    case "dm": return openDM(x);
    case "pair": return toast(`Asked ${esc(x)} to pair. Their agent will reply`);
    case "squad": return squadSheet(findQuest(x)[0]);
    case "invite": { const [q] = findQuest(b.dataset.q); (q.invited = q.invited || []).push(x); toast(`Invite sent to ${esc(x)}`); return reopen && reopen(); }
    case "reqs": return reqSheet(findQuest(x)[0]);
    case "verify": return verifySheet(x);
    case "doverify": { if (!hasSkill(x)) S.skills.push([x, "verified · " + b.dataset.m]); else S.skills = S.skills.map(([k, h]) => k === x ? [k, "verified · " + b.dataset.m] : [k, h]); toast(`${esc(x)} verified ✓`); render(); return S.screen === "quest" ? reqSheet(findQuest(S.questId)[0]) : skillsSheet(); }
    case "tool": S.tools[x] = !S.tools[x]; if (S.tools[x]) toast(`${esc(x)} connected`); return reopen && reopen();
    case "openin": return toast(`Opens ${esc(x)}. Work happens there, results sync back`);
    case "input": return inputSheet(x);
    case "history": return historySheet(findQuest(x)[0]);
    case "watchq": return toast("We'll ping you when it unlocks");
    case "nudge": return toast("Nudged. The lab replies within a day");
    case "spend": return pickSpend(x, +b.dataset.i);
    case "proof": return proofSheet(findQuest(x)[0]);
    case "attach": { const [q] = findQuest(b.dataset.q), e = q.evidence[+x]; q.proof[+x] = e.toLowerCase().replace(/[^a-z]+/g, "-") + (+x ? ".jpg" : ".pdf"); return reopen(); }
    case "submitproof": return submitProof(x);
    case "fixq": return fixQuest(x);
    case "dispute": return disputeSheet(findQuest(x)[0]);
    case "filedispute": return fileDispute(x);
    case "reviewinfo": return reviewInfo();
    case "guardinfo": return guardSheet();
    case "gvote": { const m = mission(); m.gv.mine = x; toast(`Voted · weight ${votePower(m)}`); return render(); }
    case "gchallenge": return challengeSheet(mission());
    case "flag": mission().gv.mine = "Challenged"; toast("Flagged. Referees re-check it before payouts"); return render();
    case "opengate": return stageCleared(mission());
    case "acct": return ({ skills: skillsSheet, tools: toolsSheet, spendcap: spendSheet, credits: creditsSheet, payouts: payoutSheet })[x]();
    case "cap": S.spendCap = +x; render(); return spendSheet();
    case "kyc": S.kyc = true; toast("Identity verified ✓"); render(); return payoutSheet();
    case "withdraw": if (!S.kyc) return kycSheet(); toast(`$${fmt(S.coins)} on its way · 1–2 days`); S.coins = 0; return render();
    case "export": return toast(`Credits exported to ${esc(x)}`);
  }
});

render();
</script>

</body></html>
